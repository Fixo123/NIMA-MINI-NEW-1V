<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIMAH-FAMILY-FREE-BOT-1V</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background:radial-gradient(circle at 30% 30%,#00111a,#000);
      color:#00f0ff;
    }
    .bg-gradient{
      position:absolute;
      top:0;left:0;width:100%;height:100%;
      background:linear-gradient(45deg,#00ffff,#0066ff,#ff00ff,#00ffcc);
      background-size:400% 400%;
      animation:gradientShift 12s ease infinite;
      filter:blur(100px);
      opacity:0.3;
      z-index:0;
    }
    @keyframes gradientShift{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
    .box{
      position:relative;
      width:350px;
      padding:30px;
      border-radius:15px;
      background:rgba(0,10,20,0.85);
      box-shadow:0 0 30px rgba(0,255,255,0.3),inset 0 0 15px rgba(0,255,255,0.1);
      text-align:center;
      animation:floatBox 6s ease-in-out infinite;
      z-index:2;
    }
    @keyframes floatBox{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
    h2{font-size:1.7rem;margin-bottom:5px;text-shadow:0 0 10px #00ffff;}
    h5{font-weight:400;color:#aaa;margin-bottom:15px;}
    .input-container{display:flex;margin-top:15px;width:100%;}
    input{
      flex:1;padding:12px;border:none;outline:none;border-radius:8px 0 0 8px;
      font-size:1rem;background:rgba(0,255,255,0.1);color:#fff;border:1px solid #00ffff;
    }
    input:focus{box-shadow:0 0 10px #00ffff;background:rgba(0,255,255,0.2);}
    button{
      width:30%;border:none;border-radius:0 8px 8px 0;
      background:linear-gradient(90deg,#00ffff,#0077ff);
      color:#000;font-weight:700;cursor:pointer;transition:0.3s;
    }
    button:hover{background:linear-gradient(90deg,#00ffff,#00ffcc);box-shadow:0 0 15px #00ffff;}
    #pair a{color:#fff;display:block;margin-top:15px;}
    #copy{cursor:pointer;color:#ff0088;text-shadow:0 0 8px #ff00ff;}
    .particles{
      position:absolute;top:0;left:0;width:100%;height:100%;
      overflow:hidden;z-index:1;pointer-events:none;
    }
    .particle{
      position:absolute;background:#00ffff;width:3px;height:3px;border-radius:50%;
      animation:float 8s linear infinite;opacity:0.8;
    }
    @keyframes float{0%{transform:translateY(100vh) scale(0.5);opacity:0;}100%{transform:translateY(-10vh) scale(1);opacity:1;}}
    .sound-btn{
      position:fixed;bottom:25px;right:25px;width:50px;height:50px;border-radius:50%;
      background:rgba(0,255,255,0.3);display:flex;justify-content:center;align-items:center;
      box-shadow:0 0 15px #00ffff;cursor:pointer;z-index:10;transition:0.3s;
    }
    .sound-btn:hover{transform:scale(1.1);background:rgba(0,255,255,0.6);}
    .sound-btn i{color:#fff;font-size:20px;}
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>

  <div class="sound-btn" id="soundBtn">
    <i class="fas fa-volume-up" id="soundIcon"></i>
  </div>

  <div class="box">
    <h2>NIMAH FAMILY BOT 1V</h2>
    <h5>PROGRAMAR CYBER LOKU NIMA 💠</h5>
    <p>Enter your number with country code:</p>

    <div class="input-container">
      <input placeholder="9475xxxxxxx" type="number" id="number">
      <button id="submit">Submit</button>
    </div>

    <div id="pair"></div>
  </div>

  <!-- 🎵 Background Music -->
  <audio id="bgAudio" autoplay loop>
    <source src="https://github.com/Nimsara0000/Song/raw/refs/heads/main/Enter_the_Void__Innervoix_Remix_(48k).m4a" type="audio/mp4">
  </audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    const a=document.getElementById("pair");
    const b=document.getElementById("submit");
    const c=document.getElementById("number");
    const audio=document.getElementById("bgAudio");
    const soundBtn=document.getElementById("soundBtn");
    const soundIcon=document.getElementById("soundIcon");

    soundBtn.addEventListener("click",()=>{
      if(audio.paused){audio.play();soundIcon.classList.replace("fa-volume-mute","fa-volume-up");}
      else{audio.pause();soundIcon.classList.replace("fa-volume-up","fa-volume-mute");}
    });

    async function Copy(){
      const text=document.getElementById("copy").innerText;
      const obj=document.getElementById("copy");
      await navigator.clipboard.writeText(obj.innerText.replace('CODE: ',''));
      obj.innerText="✅ COPIED";
      setTimeout(()=>{obj.innerText=text;},800);
    }

    b.addEventListener("click",async(e)=>{
      e.preventDefault();
      if(!c.value){
        a.innerHTML='<a>⚠️ Enter your WhatsApp number</a>';
      }else{
        const number=c.value.replace(/[^0-9]/g,"");
        c.value="+"+number;
        a.innerHTML='<a>Please wait...</a>';
        let {data}=await axios(`/code?number=${number}`);
        let code=data.code||"Service Unavailable";
        a.innerHTML=`<a id="copy" onclick="Copy()">CODE: <span style="color:#00ffff;">${code}</span></a>`;
      }
    });

    // Floating particles
    const container=document.getElementById('particles');
    for(let i=0;i<70;i++){
      const dot=document.createElement('div');
      dot.classList.add('particle');
      dot.style.left=Math.random()*100+'vw';
      dot.style.animationDuration=5+Math.random()*10+'s';
      dot.style.animationDelay=Math.random()*5+'s';
      container.appendChild(dot);
    }
  </script>
</body>
</html>
